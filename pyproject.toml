[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bamakan"
version = "1.1.0"
description = "BAMAKAN: an interpretable, monotone classifier that learns border (reference) levels of criteria"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Seyed Mojtaba Hosseini Bamakan"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "torch"]

[project.urls]
Repository = "https://github.com/smhbamakan/bamakan"

[tool.setuptools]
packages = ["bamakan"]
